name: sync
on:
  schedule:
    # GitHub 对高频 cron 会丢触发（实测 hourly 实际 4~10 小时才跑一次），多挂几个分钟点提高命中率
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hourly.yml"
      - "build_sub.py"
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]'
    env:
      PROBE: "1"
      PROBE_LIMIT: "2200"
      PROBE_TIMEOUT: "2.0"
      PROBE_BUDGET: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build tiers
        run: python3 build_sub.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'sub*'
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "sync $(date -u '+%F %H:%M') [skip ci]"
          git push